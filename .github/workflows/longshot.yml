name: backtest

on:
  workflow_dispatch:            # runs ONLY when you press "Run workflow"
    inputs:
      script:
        description: "Which test to run"
        default: "pm_mention_test.py"

permissions:
  contents: write

concurrency:
  group: scanners               # waits for the normal bots instead of fighting over files
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - name: "Backtest (no AI, no API key)"
        run: timeout 125m python3 -u "${{ inputs.script }}"
      - name: "Save results into the repository"
        if: always()
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "backtest results"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep 15
          done
          exit 1
