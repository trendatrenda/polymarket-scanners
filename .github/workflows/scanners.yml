name: scanners

on:
  schedule:
    - cron: "7 * * * *"         # every hour (UTC; 17 Nov: was every 2 h -- EuroLeague games could
                                # slip between two runs). Each bot still keeps its own limits.
  workflow_dispatch:            # "Run workflow" by hand: runs everything now

permissions:
  contents: write               # allowed to save the results back into the repository

concurrency:
  group: scanners               # never two runs at once (they would fight over the files)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest      # already has Python 3 -- no setup step needed (saves time)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the LATEST files, even if this run waited in the queue

      - name: "Scanner + paper market maker (#34)"
        run: |
          python3 --version
          timeout 10m python3 pm_hourly.py || echo "scanner / market maker" >> /tmp/failed.txt

      - name: "Paper bot (#35b) -- runs only when due, or always when started by hand"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then F="--force"; else F=""; fi
          timeout 6m python3 pm_paper_bot.py $F || echo "paper bot" >> /tmp/failed.txt

      - name: "EuroLeague paper bot (#37) -- every run, looks at games tipping off in 1-3 h"
        run: |
          timeout 4m python3 -u pm_euro_paper.py || echo "euroleague paper bot" >> /tmp/failed.txt

      - name: "AI forecaster (#38) -- up to 20 new forecasts per day, cost-capped"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # hidden GitHub Secret, never printed
        run: |
          timeout 7m python3 -u pm_ai_forecaster.py || echo "ai forecaster" >> /tmp/failed.txt

      - name: "AI research team (#38b) -- up to 8 markets per day, cost-capped"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # hidden GitHub Secret, never printed
        run: |
          timeout 9m python3 -u pm_ai_research.py || echo "ai research team" >> /tmp/failed.txt

      - name: "Longshot paper test (#39b) -- 30-60c rule, real order books, no AI"
        run: |
          timeout 4m python3 -u pm_longshot_paper.py || echo "longshot paper test" >> /tmp/failed.txt

      - name: "Save results into the repository"
        id: save
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
