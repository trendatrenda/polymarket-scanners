name: scanners

on:
  schedule:
    - cron: "7 */2 * * *"       # every 2 hours (UTC). The paper bot decides by itself
                                # whether it is due (at most once per 11 hours)
  workflow_dispatch:            # "Run workflow" by hand: runs everything now

permissions:
  contents: write               # allowed to save the results back into the repository

concurrency:
  group: scanners               # never two runs at once (they would fight over the files)
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest      # already has Python 3 -- no setup step needed (saves time)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the LATEST files, even if this run waited in the queue

      - name: "Scanner + paper market maker (#34)"
        run: |
          python3 --version
          timeout 10m python3 pm_hourly.py || echo "scanner / market maker" >> /tmp/failed.txt

      - name: "Paper bot (#35b) -- runs only when due, or always when started by hand"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then F="--force"; else F=""; fi
          timeout 6m python3 pm_paper_bot.py $F || echo "paper bot" >> /tmp/failed.txt

      - name: "EuroLeague paper bot (#37) -- every run, looks at games tipping off in 1-3 h"
        run: |
          timeout 4m python3 -u pm_euro_paper.py || echo "euroleague paper bot" >> /tmp/failed.txt

      - name: "Save results into the repository"
        id: save
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new to save"; exit 0; fi
          git commit -m "results $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "COULD NOT SAVE the results after 3 tries"; exit 1

      - name: "Keep a copy of the results if saving failed"
        if: failure() && steps.save.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unsaved-results
          path: |
            pm_*.csv
            pm_*.json
            pm_*.txt
            euro_*.csv
          retention-days: 14

      - name: "Turn the run RED if anything crashed or was unhealthy"
        if: always()
        run: |
          if [ -f /tmp/failed.txt ]; then
            echo "These were unhealthy or crashed this run:"; cat /tmp/failed.txt; exit 1
          fi
